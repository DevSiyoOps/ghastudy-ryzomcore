name: "Cleanup: delete untagged container"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

permissions:
  packages: write

jobs:
  delete_versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          min-versions-to-keep: 10
          package-name: ryzomcore-nelns
          package-type: container
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          min-versions-to-keep: 10
          package-name: ryzomcore-snowballs
          package-type: container
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          min-versions-to-keep: 10
          package-name: ryzomcore-tools
          package-type: container
